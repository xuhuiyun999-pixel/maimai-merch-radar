[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maimai-merch-radar"
version = "0.1.0"
description = "Read-only McDonald's merchandise and campaign radar"
requires-python = ">=3.12"
dependencies = ["mcp==1.30.0", "jsonschema>=4.20,<5"]

[project.scripts]
maimai-radar = "maimai_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
